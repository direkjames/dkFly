# dkCore must be published first: in the dkCore project run `gradlew publishToMavenLocal`.
dkCoreVersion=1.1.1

# Purpur API for our server (26.3). If Gradle can't resolve it, check
# https://repo.purpurmc.org for the exact purpur-api version string.
purpurVersion=26.3.build.+

# Soft-dependency APIs (compileOnly, never shaded). If one can't be resolved,
# put the exact version your server runs instead of the "+".
placeholderApiVersion=2.11.6
worldGuardVersion=7.0.+
worldEditVersion=7.3.+

org.gradle.caching=true
